name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            command: wails3 task linux:create:appimage
            artifacts: bin/*.AppImage
          - os: windows-latest
            name: windows
            command: wails3 task windows:create:nsis:installer
            artifacts: bin/*installer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Add Go binaries to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Add NSIS to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: deckdrop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
