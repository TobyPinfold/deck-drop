name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built in Valve's Steam Runtime SDK so it runs on SteamOS.
          - os: ubuntu-latest
            name: linux
            steamrt: true
            artifacts: bin/*.AppImage
          - os: ubuntu-24.04-arm
            name: linux-arm64
            command: wails3 task linux:create:appimage
            artifacts: bin/*.AppImage
          - os: macos-latest
            name: macos
            command: wails3 task darwin:package && ditto -c -k --keepParent bin/deckdrop.app bin/deckdrop-macos.zip
            artifacts: bin/deckdrop-macos.zip
          - os: windows-latest
            name: windows
            command: wails3 task windows:create:nsis:installer
            artifacts: bin/*installer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Build the frontend
        if: matrix.steamrt
        run: npm ci && npm run build
        working-directory: frontend
      - name: Build in the Steam Linux Runtime 3.0 (sniper) SDK
        if: matrix.steamrt
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest \
            build/linux/steamrt-build.sh
          sudo chown -R "$(id -u):$(id -g)" bin
      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && !matrix.steamrt
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
        if: ${{ !matrix.steamrt }}
      - name: Add Go binaries to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Add NSIS to PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
      - run: ${{ matrix.command }}
        if: ${{ !matrix.steamrt }}
      - uses: actions/upload-artifact@v4
        with:
          name: deckdrop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
