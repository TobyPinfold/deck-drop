<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DeckDrop</title>
</head>
<body>
<header>
    <h1>DeckDrop</h1>
    <p id="status">Starting…</p>
</header>
<main class="columns">
    <div class="column">
        <h2>Nearby devices</h2>
        <ul id="devices" class="devices"></ul>
        <p id="empty" class="empty">Looking for devices on your network…</p>

        <h2>Send</h2>
        <div class="panel" data-file-drop-target>
            <button id="choose" class="action" type="button" disabled>Choose files</button>
            <p id="hint" class="hint">Select a device, then choose or drop files to send.</p>
        </div>
    </div>
    <div class="column">
        <section id="transfers-section" hidden>
            <h2>Transfers</h2>
            <ul id="transfers" class="transfers"></ul>
        </section>

        <h2>Received</h2>
        <div class="panel">
            <button id="open-folder" class="action" type="button">Open folder</button>
            <p id="receive-dir" class="hint"></p>
        </div>
        <ul id="received" class="received"></ul>
        <p id="received-empty" class="empty">Nothing received yet.</p>

        <h2>Settings</h2>
        <form id="settings" class="panel settings">
            <label class="field">
                <span>Device name</span>
                <input id="setting-name" type="text" autocomplete="off" spellcheck="false" required>
            </label>
            <label class="field">
                <span>Port</span>
                <input id="setting-port" type="number" min="1" max="65535" required>
            </label>
            <div class="field">
                <span>Receive folder</span>
                <div class="folder">
                    <code id="setting-dir"></code>
                    <button id="choose-folder" class="action" type="button">Change folder</button>
                </div>
            </div>
            <div class="form-actions">
                <button id="save-settings" class="action" type="submit">Save</button>
                <p id="settings-message" class="hint" role="status"></p>
            </div>
        </form>
    </div>
</main>
<script src="./src/main.js" type="module"></script>
</body>
</html>
