<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DeckDrop</title>
</head>
<body>
<header>
    <h1>DeckDrop</h1>
    <p id="status">Starting…</p>
</header>
<main class="columns">
    <div class="column">
        <h2>Nearby devices</h2>
        <ul id="devices" class="devices"></ul>
        <p id="empty" class="empty">Looking for devices on your network…</p>

        <h2>Send</h2>
        <div class="panel" data-file-drop-target>
            <button id="choose" class="action" type="button" disabled>Choose files</button>
            <p id="hint" class="hint">Select a device, then choose or drop files to send.</p>
        </div>
    </div>
    <div class="column">
        <section id="transfers-section" hidden>
            <h2>Transfers</h2>
            <ul id="transfers" class="transfers"></ul>
        </section>

        <h2>Received</h2>
        <div class="panel">
            <button id="open-folder" class="action" type="button">Open folder</button>
            <p id="receive-dir" class="hint"></p>
        </div>
        <ul id="received" class="received"></ul>
        <p id="received-empty" class="empty">Nothing received yet.</p>
    </div>
</main>
<script src="./src/main.js" type="module"></script>
</body>
</html>
